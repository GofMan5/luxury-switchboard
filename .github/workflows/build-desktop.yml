name: arm64 ldd repro

on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf file
      - name: Build binaries and probe ldd around the rpath patch
        run: |
          echo "== env: arch $(uname -m), glibc: $(ldd --version | head -1), patchelf $(patchelf --version), bash $BASH_VERSION"
          mkdir -p "/tmp/repro/Luxury Switchboard.AppDir/usr/bin" "/tmp/repro/Luxury Switchboard.AppDir/usr/lib" /tmp/repro/ns/usr/bin /tmp/repro/ns/usr/lib
          cd backend
          CGO_ENABLED=1 go build -trimpath -o /tmp/dyn-go ./cmd/switchboard-sidecar
          CGO_ENABLED=0 go build -trimpath -o /tmp/static-go ./cmd/switchboard-sidecar
          cd /tmp
          printf 'int main(void){return 0;}' > /tmp/plain.c
          cc /tmp/plain.c -o /tmp/plain-c
          RTLD=/lib/ld-linux-aarch64.so.1
          [ -x "$RTLD" ] || RTLD=/lib64/ld-linux-aarch64.so.1
          echo "== rtld: $RTLD ($($RTLD --version | head -1))"

          probe() {
            f="$1"; tag="$2"
            echo "##### $tag : ldd BEFORE rpath patch"
            LC_ALL=C ldd "$f" 2>&1; echo "ldd exit: $?"
            echo "##### $tag : direct rtld trace BEFORE rpath patch"
            LD_TRACE_LOADED_OBJECTS=1 LC_ALL=C "$RTLD" "$f" 2>&1; echo "rtld exit: $?"
            echo "##### $tag : patchelf --set-rpath \$ORIGIN/../lib"
            patchelf --set-rpath '$ORIGIN/../lib' "$f" 2>&1; echo "patchelf exit: $?"
            echo "##### $tag : readelf -d AFTER rpath patch"
            readelf -d "$f" | grep -E 'RPATH|RUNPATH|NEEDED'
            echo "##### $tag : ldd AFTER rpath patch"
            LC_ALL=C ldd "$f" 2>&1; echo "ldd exit: $?"
            echo "##### $tag : direct rtld trace AFTER rpath patch"
            LD_TRACE_LOADED_OBJECTS=1 LC_ALL=C "$RTLD" "$f" 2>&1; echo "rtld exit: $?"
          }

          cp /tmp/dyn-go "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/switchboard-sidecar"
          cp /tmp/plain-c "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/plain-c"
          cp /tmp/static-go "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/static-go"
          cp /tmp/dyn-go /tmp/repro/ns/usr/bin/switchboard-sidecar

          probe "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/switchboard-sidecar" "space/dyn-go"
          probe "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/plain-c" "space/plain-c"
          probe "/tmp/repro/ns/usr/bin/switchboard-sidecar" "nospace/dyn-go"

          echo "##### static-go : ldd (unpatched)"
          LC_ALL=C ldd "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/static-go" 2>&1; echo "ldd exit: $?"
          echo "##### static-go : direct rtld trace (unpatched)"
          LD_TRACE_LOADED_OBJECTS=1 LC_ALL=C "$RTLD" "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/static-go" 2>&1; echo "rtld exit: $?"
          echo "##### static-go : patchelf --set-rpath attempt"
          patchelf --set-rpath '$ORIGIN/../lib' "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/static-go" 2>&1; echo "patchelf exit: $?"
          echo "##### static-go : ldd after patch attempt"
          LC_ALL=C ldd "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/static-go" 2>&1; echo "ldd exit: $?"
