name: Build desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# A release tag (or a manual dispatch) builds the installers for every
# supported platform and uploads them. A branch push or a pull request runs
# the same checks and stops there: a broken bump must fail the commit, not
# the release it was cut for.
concurrency:
  group: build-desktop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # SignPath downloads the unsigned installer artifact through the Actions
    # API, which needs actions: read on top of the workflow's contents: read.
    permissions:
      actions: read
      contents: read
    env:
      # Only release tags of the Windows installers are signed, and only once
      # the owner configured SignPath (docs/CODE-SIGNING.md). Every signing
      # request waits for a manual approval, so a manual dispatch stays
      # unsigned instead of blocking on one.
      SIGN_WITH_SIGNPATH: ${{ startsWith(matrix.artifact, 'switchboard-windows-') && github.ref_type == 'tag' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    strategy:
      # Every installer is built on a native runner: scripts/build-sidecar.mjs
      # compiles the Go sidecar for the Rust host triple, so each architecture
      # needs its own machine instead of a cross-compile.
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: switchboard-windows-x64
          - name: Windows arm64
            os: windows-11-arm
            artifact: switchboard-windows-arm64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: switchboard-linux-x64
            # Ubuntu 22.04 still carries the transitional libappindicator3-dev.
            linux_packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
          - name: Linux arm64
            os: ubuntu-24.04-arm
            artifact: switchboard-linux-arm64
            # Ubuntu 24.04 dropped the transitional name, only ayatana is there.
            linux_packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
          - name: macOS arm64
            os: macos-latest
            artifact: switchboard-macos-arm64
          - name: macOS x64
            os: macos-15-intel
            artifact: switchboard-macos-x64
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linux_packages }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Check Go formatting
        # Cheap and deterministic, so it runs first and only once: a formatting
        # drift should fail the commit before twenty minutes of tests spend
        # themselves on it. The definition of done names gofmt alongside vet.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted=$(gofmt -l backend)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-formatted:" && echo "$unformatted"
            exit 1
          fi
      - name: Check source
        # GitHub's bash wrapper stops at every native nonzero exit on all hosts;
        # PowerShell's default wrapper can hide an earlier exit behind cargo.
        shell: bash
        run: |
          pnpm version:check
          pnpm --dir frontend lint
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          node --test scripts/plugin.test.mjs
          go -C backend test ./...
          go -C backend vet ./...
          go -C backend mod verify
          # The tauri build script validates the sidecar's externalBin path even
          # for a test build, so the sidecar must exist before cargo runs.
          pnpm sidecar:build
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Race the concurrent slices
        # The plain runs above catch logic; only -race catches the data races
        # in the code that owns shared state. The whole tree under race is
        # minutes of CI for little extra signal, so the list is the slices
        # that actually run goroutines sharing memory: the relay, the pools,
        # the queues, the stdio server and the composition that wires them.
        if: runner.os == 'Linux'
        run: go -C backend test -race ./internal/platform/... ./internal/slices/keypool/... ./internal/slices/relay/... ./internal/slices/analytics/... ./internal/slices/activity/... ./internal/slices/publictunnel/... ./internal/app/...
      - name: Build the installers
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        # linuxdeploy runs as an AppImage and arm64 runners ship no FUSE
        # device, so it executes from its extracted directory like the
        # Docker-based local build already does.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm build
      # Authenticode signing changes the installer bytes, so it happens here,
      # before the final upload: collect computes SHA256SUMS.txt from exactly
      # the files this job uploads, and the updater verifies against it.
      - name: Read the release version
        id: version
        if: env.SIGN_WITH_SIGNPATH == 'true'
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Upload the unsigned installer for SignPath
        id: unsigned
        if: env.SIGN_WITH_SIGNPATH == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Not switchboard-*: collect downloads that pattern and must never
          # merge an unsigned copy over the signed installer.
          name: unsigned-${{ matrix.artifact }}
          path: artifacts/release/*.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign the installer with SignPath
        if: env.SIGN_WITH_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
          # The release signing policy waits for a manual approval.
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed
      - name: Verify and install the signed installer
        if: env.SIGN_WITH_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath artifacts/release -Filter *.exe)
          if ($installers.Count -eq 0) { throw 'no installer to replace' }
          foreach ($installer in $installers) {
            $signed = Join-Path artifacts/signed $installer.Name
            if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath returned no $($installer.Name)" }
            $signature = Get-AuthenticodeSignature -LiteralPath $signed
            if ($signature.Status -ne 'Valid') { throw "$($installer.Name): signature is $($signature.Status)" }
            Move-Item -LiteralPath $signed -Destination $installer.FullName -Force
            Write-Output "$($installer.Name) signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Warn about an unsigned Windows installer
        if: runner.os == 'Windows' && env.SIGN_WITH_SIGNPATH != 'true' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: echo "::warning::The Windows installer is not Authenticode-signed; SmartScreen will warn. See docs/CODE-SIGNING.md."
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/release/*.exe
            artifacts/release/*.AppImage
            artifacts/release/*.deb
            artifacts/release/*.dmg
          if-no-files-found: error
          retention-days: 14

  collect:
    name: One release folder
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # v5 defaults package-manager-cache to true, which auto-detects
          # pnpm-lock.yaml and demands the pnpm executable. collect runs
          # --checksums-only under bare Node, so the cache probe is disabled
          # rather than satisfied with a pnpm install this job never needed.
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: switchboard-*
          # The build uploads every installer from artifacts/release, so the
          # download has to restore that exact directory: --checksums-only
          # reads it and refuses to invent checksums for files elsewhere.
          path: artifacts/release
          merge-multiple: true
      - run: node scripts/build-release.mjs --checksums-only
      - uses: actions/upload-artifact@v4
        with:
          name: Luxury-Switchboard-All-Platforms
          path: artifacts/release
          if-no-files-found: error
          retention-days: 30
