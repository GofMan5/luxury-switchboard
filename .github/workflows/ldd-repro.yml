name: arm64 ldd repro

on:
  workflow_dispatch:

jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-22.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq patchelf file
      - name: Build binaries and probe ldd around the rpath patch
        run: |
          set +e
          echo "== env: arch $(uname -m), glibc: $(ldd --version 2>/dev/null | head -1), patchelf $(patchelf --version), bash $BASH_VERSION"
          mkdir -p /tmp/repro/ns/usr/bin /tmp/repro/ns/usr/lib "/tmp/repro/Luxury Switchboard.AppDir/usr/bin" "/tmp/repro/Luxury Switchboard.AppDir/usr/lib"
          cd backend
          CGO_ENABLED=1 go build -trimpath -o /tmp/dyn-go ./cmd/switchboard-sidecar || { echo "BUILD FAIL dyn-go"; exit 1; }
          CGO_ENABLED=0 go build -trimpath -o /tmp/static-go ./cmd/switchboard-sidecar || { echo "BUILD FAIL static-go"; exit 1; }
          cd /tmp
          printf 'int main(void){return 0;}' > /tmp/plain.c
          cc /tmp/plain.c -o /tmp/plain-c || { echo "BUILD FAIL plain-c"; exit 1; }
          RTLD=$(readelf -l /tmp/plain-c 2>/dev/null | grep 'Requesting program interpreter' | sed 's/.*: \(.*\)]/\1/')
          echo "== rtld: $RTLD ($($RTLD --version 2>/dev/null | head -1))"
          file /tmp/dyn-go /tmp/static-go /tmp/plain-c

          probe() {
            f="$1"; tag="$2"; rpath="$3"
            echo "##### $tag : file"
            file -b "$f" 2>&1
            echo "##### $tag : ldd BEFORE rpath patch"
            LC_ALL=C ldd "$f" 2>&1; echo "ldd exit: $?"
            echo "##### $tag : direct rtld trace BEFORE rpath patch"
            LD_TRACE_LOADED_OBJECTS=1 LC_ALL=C "$RTLD" "$f" 2>&1; echo "rtld exit: $?"
            if [ -n "$rpath" ]; then
              echo "##### $tag : patchelf --set-rpath $rpath"
              patchelf --set-rpath "$rpath" "$f" 2>&1; echo "patchelf exit: $?"
            else
              echo "##### $tag : no rpath patch (baseline)"
            fi
            echo "##### $tag : readelf -d AFTER"
            readelf -d "$f" 2>&1 | grep -E 'RPATH|RUNPATH|NEEDED'
            echo "##### $tag : ldd AFTER rpath patch"
            LC_ALL=C ldd "$f" 2>&1; echo "ldd exit: $?"
            echo "##### $tag : direct rtld trace AFTER rpath patch"
            LD_TRACE_LOADED_OBJECTS=1 LC_ALL=C "$RTLD" "$f" 2>&1; echo "rtld exit: $?"
            echo "##### $tag : rtld --list AFTER rpath patch"
            LC_ALL=C "$RTLD" --list "$f" 2>&1; echo "rtld-list exit: $?"
            echo "##### $tag : END"
          }

          cp /tmp/dyn-go /tmp/repro/ns/usr/bin/switchboard-sidecar
          cp /tmp/plain-c /tmp/repro/ns/usr/bin/plain-c
          cp /tmp/static-go /tmp/repro/ns/usr/bin/static-go
          cp /tmp/dyn-go "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/switchboard-sidecar"

          probe /tmp/repro/ns/usr/bin/switchboard-sidecar "nospace/dyn-go/rpath" '$ORIGIN/../lib'
          probe /tmp/repro/ns/usr/bin/plain-c "nospace/plain-c/rpath" '$ORIGIN/../lib'
          probe "/tmp/repro/Luxury Switchboard.AppDir/usr/bin/switchboard-sidecar" "space/dyn-go/rpath" '$ORIGIN/../lib'

          echo "##### static-go : ldd (unpatched)"
          LC_ALL=C ldd /tmp/repro/ns/usr/bin/static-go 2>&1; echo "ldd exit: $?"
          echo "##### static-go : patchelf --set-rpath attempt"
          patchelf --set-rpath '$ORIGIN/../lib' /tmp/repro/ns/usr/bin/static-go 2>&1; echo "patchelf exit: $?"
          echo "##### static-go : ldd after patch attempt"
          LC_ALL=C ldd /tmp/repro/ns/usr/bin/static-go 2>&1; echo "ldd exit: $?"
          echo "##### ALL PROBES COMPLETE"
