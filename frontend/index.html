<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/switchboard.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#212121" />
    <title>Luxury Switchboard</title>
    <!-- The boot sentinel's stylesheet and hook: both load before the bundle,
         because the bundle failing to load is exactly when they are needed.
         Neither may be inlined — the CSP allows these files, not inline code. -->
    <link rel="stylesheet" href="/boot.css" />
    <script src="/boot-hook.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot-sentinel" role="status" aria-live="polite">
        <p>Starting Luxury Switchboard…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
