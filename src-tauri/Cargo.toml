[package]
name = "switchboard-desktop"
version = "1.0.54"
description = "Luxury Switchboard desktop shell"
authors = ["Luxury Switchboard contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "switchboard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2.3.5"
# Native file dialog for importing Codex sign-in files. A direct rfd
# dependency instead of the dialog plugin, for the same reason open_url uses
# shell::open: one call does not justify a second Tauri plugin surface. The
# default features (gtk3 on Linux) match the toolkit the Tauri Linux build
# already carries; Windows and macOS use the platform dialogs natively.
rfd = "0.15"
